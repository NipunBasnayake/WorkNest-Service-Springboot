services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: worknest-backend:dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      MASTER_DB_HOST: database
      MASTER_DB_PORT: 3306
      MASTER_DB_NAME: ${MASTER_DB_NAME:-platform_master}
      MASTER_DB_USERNAME: ${DOCKER_MYSQL_USER:-worknest_dev}
      MASTER_DB_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-worknest_dev_password}
      JWT_SECRET: ${JWT_SECRET:-V29ya05lc3N0RGV2ZWxvcG1lbnRTZWNyZXRLZXlBdExlYXN0MzJCeXRlcw==}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-worknest-assets}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:5173}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-http://localhost:5173}
      PASSWORD_RESET_LINK_BASE_URL: ${PASSWORD_RESET_LINK_BASE_URL:-http://localhost:5173/reset-password}
      SWAGGER_PUBLIC_ENABLED: ${SWAGGER_PUBLIC_ENABLED:-true}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - worknest-dev-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MASTER_DB_NAME:-platform_master}
      MYSQL_USER: ${DOCKER_MYSQL_USER:-worknest_dev}
      MYSQL_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-worknest_dev_password}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-worknest_root_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - worknest-dev-database-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - worknest-dev-network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  worknest-dev-database-data:

networks:
  worknest-dev-network:
    driver: bridge
