services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE_NAME:-worknest-backend:latest}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - worknest-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SERVER_PORT:-8080}/actuator/health/readiness || curl -fsS http://127.0.0.1:${SERVER_PORT:-8080}/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

networks:
  worknest-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-worknest_network}
