server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: worknest-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jmx:
    enabled: false

  datasource:
    hikari:
      maximum-pool-size: ${MASTER_DB_POOL_MAX_SIZE:15}
      minimum-idle: ${MASTER_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:0}
      pool-name: WorkNestMasterPool
      register-mbeans: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        jdbc:
          time_zone: ${JDBC_TIME_ZONE:UTC}

  jackson:
    serialization:
      indent-output: ${JACKSON_INDENT_OUTPUT:false}
    default-property-inclusion: non_null
    time-zone: ${APP_TIMEZONE:UTC}

  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI:DETECT}

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}

storage:
  max-image-size: ${STORAGE_MAX_IMAGE_SIZE:2MB}
  max-document-size: ${STORAGE_MAX_DOCUMENT_SIZE:10MB}
  allowed-image-types:
    - jpg
    - jpeg
    - png
    - webp
  allowed-document-types:
    - pdf
    - docx
    - xlsx
    - pptx
    - zip
  reconciliation:
    enabled: ${STORAGE_RECONCILIATION_ENABLED:true}
    cron: "${STORAGE_RECONCILIATION_CRON:0 17 3 * * *}"
    time-zone: ${STORAGE_RECONCILIATION_TIMEZONE:UTC}
    superseded-retention: ${STORAGE_SUPERSEDED_RETENTION:P7D}
    orphan-grace: ${STORAGE_ORPHAN_GRACE:PT24H}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    request-timeout: ${SUPABASE_REQUEST_TIMEOUT:30s}
    signed-url-ttl: ${SUPABASE_SIGNED_URL_TTL:10m}
    buckets:
      avatars: ${SUPABASE_BUCKET_AVATARS:${SUPABASE_BUCKET:}}
      documents: ${SUPABASE_BUCKET_DOCUMENTS:${SUPABASE_BUCKET:}}
      recruitment: ${SUPABASE_BUCKET_RECRUITMENT:${SUPABASE_BUCKET:}}
      chat: ${SUPABASE_BUCKET_CHAT:${SUPABASE_BUCKET:}}
      projects: ${SUPABASE_BUCKET_PROJECTS:${SUPABASE_BUCKET:}}
      logos: ${SUPABASE_BUCKET_LOGOS:${SUPABASE_BUCKET:}}

logging:
  pattern:
    level: "%5p [tenant:%X{tenantId:-na}]"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.type.descriptor.sql: ${LOG_LEVEL_HIBERNATE_BIND:WARN}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.web.socket: ${LOG_LEVEL_WEBSOCKET:INFO}
    org.springframework.messaging: ${LOG_LEVEL_MESSAGING:INFO}
    com.worknest: ${LOG_LEVEL_WORKNEST:INFO}

app:
  tenant:
    header: ${TENANT_HEADER:X-Tenant-ID}
    default: ${TENANT_DEFAULT:master}
    jpa:
      hibernate:
        ddl-auto: ${TENANT_JPA_DDL_AUTO:${JPA_DDL_AUTO:update}}
    datasource:
      cache:
        max-cached-pools: ${TENANT_DB_MAX_CACHED_POOLS:100}
        idle-eviction-ms: ${TENANT_DB_IDLE_EVICTION_MS:900000}
        eviction-interval-ms: ${TENANT_DB_EVICTION_INTERVAL_MS:60000}
      pool:
        maximum-pool-size: ${TENANT_DB_POOL_MAX_SIZE:8}
        minimum-idle: ${TENANT_DB_POOL_MIN_IDLE:0}
        connection-timeout-ms: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
        idle-timeout-ms: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
        max-lifetime-ms: ${DB_POOL_MAX_LIFETIME_MS:1800000}
        validation-timeout-ms: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
        leak-detection-threshold-ms: ${DB_POOL_LEAK_DETECTION_MS:0}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    refresh-rotation-grace-ms: ${JWT_REFRESH_ROTATION_GRACE_MS:45000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:}}
  security:
    public-health-enabled: ${PUBLIC_HEALTH_ENABLED:true}
    swagger-public-enabled: ${SWAGGER_PUBLIC_ENABLED:false}
  email:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@example.com}
    executor:
      core-pool-size: ${MAIL_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${MAIL_EXECUTOR_MAX_POOL_SIZE:10}
      queue-capacity: ${MAIL_EXECUTOR_QUEUE_CAPACITY:500}
      keep-alive-seconds: ${MAIL_EXECUTOR_KEEP_ALIVE_SECONDS:60}
  public-web-base-url: ${PUBLIC_WEB_BASE_URL:}
  auth:
    password-reset:
      token-expiry-minutes: ${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:20}
      link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:${app.public-web-base-url}/reset-password}
  reminders:
    cron: "${REMINDERS_CRON:0 0 */6 * * *}"
    timezone: ${REMINDERS_TIMEZONE:UTC}
    leave:
      days-before-start: ${LEAVE_REMINDER_DAYS_BEFORE_START:1,2}
    task:
      days-before-due: ${TASK_REMINDER_DAYS_BEFORE_DUE:1,2,3}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:${MAIL_ENABLED:false}}

bootstrap:
  platform-admin:
    enabled: ${BOOTSTRAP_PLATFORM_ADMIN_ENABLED:false}
    name: ${BOOTSTRAP_PLATFORM_ADMIN_NAME:Platform Admin}
    email: ${BOOTSTRAP_PLATFORM_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:}
